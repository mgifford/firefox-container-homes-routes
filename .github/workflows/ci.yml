name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint extension
        run: npm run lint

      - name: Build extension
        run: npm run build

  e2e:
    name: End-to-end (headless Firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest ships Firefox; Selenium Manager finds it and geckodriver.
      - name: Show Firefox version
        run: firefox --version

      - name: Run end-to-end tests
        run: npm run test:e2e
